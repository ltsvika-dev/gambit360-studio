    addEventListener('pointerdown', e => { if (!tm.hidden && !tm.contains(e.target) && !tb.contains(e.target)) tm.hidden = true; });
    addEventListener('blur', () => { tm.hidden = true; });
  }
  // ---- jump points: places in the tour (a Matterport "link to this location": ss = the scan point, sr = the view direction) ----
  const spots = (cfg.spots || []).filter(x => x && /^\d{1,4}$/.test(String(x.ss)));
  if (spots.length || cfg.spotOn) {
    const sb = $('spotBtn'), sm = $('smenu'), ic = (cfg.icons || {}).spots; tint(sm, 'spots');
    sb.querySelector('svg').innerHTML = ICONS[ICONS[ic] ? ic : 'pin']; const lb = bLbl('spots') || TX.spots; sb.querySelector('span').textContent = lb; sb.title = lb; sb.setAttribute('aria-label', lb); sb.hidden = false;
    const go = x => {
      let j = x.m ? tourList.findIndex(o => o.model === x.m) : 0; if (j < 0) j = ti;   // the point's own tour (a point without a model belongs to the main tour)
      if (j === ti && !wantSdk) {   // the same tour: only the tour reloads at that place (logo, music and buttons stay)
        p.set('ss', String(x.ss)); if (x.sr) p.set('sr', x.sr); else p.delete('sr'); p.set('play', '1'); p.set('qs', '1');
        const sh = $('mpTap'); if (sh) sh.remove();
        iframe.src = 'https://my.matterport.com/show/?' + p.toString(); dispatchEvent(new Event('g360play')); return;
      }
      const u = new URL(location.href);   // another tour, or the SDK is connected (nadir, map): the page opens again at that place
      if (j) u.searchParams.set('tour', String(j)); else u.searchParams.delete('tour');
      u.searchParams.set('ss', String(x.ss)); if (x.sr) u.searchParams.set('sr', x.sr); else u.searchParams.delete('sr'); u.searchParams.set('play', '1'); u.searchParams.set('qs', '1');
      location.href = u.toString();
    };
    spots.forEach(x => { const b = document.createElement('button'); b.type = 'button'; b.textContent = x.name || ('#' + x.ss); b.dir = 'auto'; b.onclick = () => { sm.hidden = true; go(x); }; sm.appendChild(b); });
    const placeS = () => { const r = sb.getBoundingClientRect(); sm.style.transform = '';
      if (matchMedia('(max-width: 640px)').matches) { sm.style.right = 'auto'; sm.style.left = '50%'; sm.style.transform = 'translateX(-50%)'; sm.style.top = Math.round(innerHeight / 3) + 'px'; mqAll(sm); return; }   // phone: centred, like the video list
      if (bp.spots === 'r') { sm.style.left = 'auto'; sm.style.right = bo.side + 'px'; sm.style.top = (r.bottom + 8) + 'px'; } else { sm.style.right = 'auto'; sm.style.left = (r.right + 8) + 'px'; sm.style.top = r.top + 'px'; } };
    sb.onclick = e => { e.stopPropagation(); ['tmenu', 'vmenu'].forEach(id => { const m = $(id); if (m) m.hidden = true; }); sm.hidden = !sm.hidden || !spots.length; if (!sm.hidden) placeS(); };
    addEventListener('pointerdown', e => { if (!sm.hidden && !sm.contains(e.target) && !sb.contains(e.target)) sm.hidden = true; });
    addEventListener('blur', () => { sm.hidden = true; });
  }
  const placeLogo = () => { const a = $('logo'); if (a.style.display === 'block' && a.classList.contains('tr')) { const w = $('ctl').offsetWidth; const ls = cfg.logo && Number.isFinite(+cfg.logo.side) && cfg.logo.side != null ? +cfg.logo.side : 14; a.style.right = (w ? w + bo.side + 8 : ls) + 'px'; } };   // a logo at the top right steps aside for the buttons















  placeLogo(); addEventListener('resize', placeLogo);
  // loading-screen logo: centred below the Play button / above Matterport's logo, gone once the visitor starts the tour (a click inside the tour moves focus to it)
  if (cfg.splash) {
    const sp = $('splash'); sp.src = base + cfg.splash; sp.hidden = false;
    { const w = +cfg.splashW; if (w > 0 && w !== 260) { sp.style.maxWidth = 'min(86vw,' + w + 'px)'; sp.style.maxHeight = Math.round(Math.max(22, Math.min(40, w / 260 * 22))) + 'vh'; } }   // its size, chosen in the Studio
    let fr = null, t0 = Date.now(), loaded = false;
    const hide = () => { sp.hidden = true; clearInterval(iv); };
    const iv = setInterval(() => {
      fr = fr || document.querySelector('iframe');
      if (fr && !loaded) { loaded = true; if (+(cfg.mp && cfg.mp.play)) fr.addEventListener('load', () => setTimeout(hide, 3000), { once: true }); }
      if ((fr && document.activeElement === fr) || Date.now() - t0 > 600000) hide();
    }, 250);
    addEventListener('blur', () => setTimeout(() => { if (fr && document.activeElement === fr) hide(); }, 0));
  }

  const sweeps = {}, listeners = [];
  let pose = null;
  const floorOf = ps => { const s = ps && sweeps[ps.sweep]; return s && s.floorInfo ? s.floorInfo.sequence : (s && s.floor != null ? s.floor : -1); };
  const inside = ps => !!ps && String(ps.mode).indexOf('inside') >= 0;

  if (!wantSdk) {
    if (mini) setupMini(null);   // without the SDK the map is shown as a plain picture
    return;
  }

  // ---- Showcase SDK ----
  // a key that Matterport refuses (wrong key, or this site's address not allowed for it) stops the tour from loading at all,
  // so when the SDK does not connect the tour opens again without the key: the tour always works, only the SDK extras are left out
  const sdkNote = (a, e) => { try { const fd = new FormData(); fd.append('action', a); fd.append('k', String(cfg.sdkKey).slice(-4)); fd.append('err', String(e && e.message || e || '').slice(0, 200)); navigator.sendBeacon(root + 'upload.php', fd); } catch (x) {} };
  let sdk;
  try {
    await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://static.matterport.com/showcase-sdk/latest.js'; s.onload = res; s.onerror = () => rej(new Error('showcase-sdk script did not load')); document.head.appendChild(s); });
    if (tapWait) await tapWait;   /* connect to the tour that actually plays */
    sdk = await Promise.race([window.MP_SDK.connect(iframe, cfg.sdkKey, ''), new Promise((res, rej) => setTimeout(() => rej(new Error('timeout')), 60e3))]);   // no answer at all for a minute counts as a refusal
  } catch (e) {
    console.warn('Gambit360: SDK connect failed, the tour opens without the SDK', e);
    wantSdk = false; reelState = 'fail'; reelDone();
    try { localStorage.setItem(sdkBadK, String(Date.now())); } catch (x) {}
    p.delete('applicationKey'); iframe.src = 'https://my.matterport.com/show/?' + p.toString();
    sdkNote('sdkfail', e);
    if (mini) setupMini(null);
    return;
  }
  try { if (localStorage.getItem(sdkBadK) || Date.now() - (+localStorage.getItem(sdkOkK) || 0) > 12 * 3600e3) { localStorage.removeItem(sdkBadK); localStorage.setItem(sdkOkK, String(Date.now())); sdkNote('sdkok', ''); } } catch (x) {}   // the Studio learns that the key works (again)

  try {
    sdk.Sweep.data.subscribe({
      onAdded(k, s) { sweeps[k] = s; if (s && s.sid) sweeps[s.sid] = s; if (s && s.id) sweeps[s.id] = s; },
      onUpdated(k, s) { sweeps[k] = s; if (s && s.sid) sweeps[s.sid] = s; if (s && s.id) sweeps[s.id] = s; },
      onCollectionUpdated(c) { Object.keys(c).forEach(k => { const s = c[k]; sweeps[k] = s; if (s && s.sid) sweeps[s.sid] = s; if (s && s.id) sweeps[s.id] = s; }); }
    });
  } catch (e) {}
  sdk.Camera.pose.subscribe(ps => { pose = ps; listeners.forEach(f => { try { f(ps); } catch (e) {} }); });

  // ---- nadir: a round logo on the floor under the camera (covers the tripod) ----
  if (cfg.nadir && cfg.nadir.file && !calibMode) {
    try {
      const url = base + cfg.nadir.file, size = cfg.nadir.size || .9, op = cfg.nadir.opacity == null ? 1 : cfg.nadir.opacity;
      function Nadir() {
        this.inputs = {};
        this.onInit = function () {
          const T = this.context.three;
          const tex = new T.TextureLoader().load(url);
          const mat = new T.MeshBasicMaterial({ map: tex, transparent: true, opacity: op, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 });
          const mesh = new T.Mesh(new T.CircleGeometry(size / 2, 64), mat);
          mesh.rotation.x = -Math.PI / 2; mesh.renderOrder = 10;
          this.outputs.objectRoot = mesh;
        };
      }
      await sdk.Scene.register('g360nadir', () => new Nadir());
      let node;
      if (sdk.Scene.createObjects) { const [o] = await sdk.Scene.createObjects(1); node = o.addNode(); node.addComponent('g360nadir'); o.start(); }
      else { node = await sdk.Scene.createNode(); node.addComponent('g360nadir'); node.start(); }
      const place = ps => {
        const s = sweeps[ps.sweep], fp = s && (s.floorPosition || null);
        const ok = inside(ps) && !!fp;
        node.obj3D.visible = ok;
        if (ok) node.obj3D.position.set(fp.x, fp.y + .015, fp.z);
      };
      listeners.push(place); if (pose) place(pose);
    } catch (e) { console.warn('Gambit360: nadir is not available', e); }
  }

  loadReel(sdk); if (mini) setupMini(sdk);
  if (calibMode) setupCalib();

  // ===== mini map =====
  function affine(c) {   // three pairs [u, v, x, z] → u = a·x + b·z + c, v = d·x + e·z + f
    if (!c || c.length < 3) return null;
    const [p1, p2, p3] = c, det = p1[2] * (p2[3] - p3[3]) - p1[3] * (p2[2] - p3[2]) + (p2[2] * p3[3] - p3[2] * p2[3]);
    if (Math.abs(det) < 1e-9) return null;
    const solve = i => {
      const r1 = p1[i], r2 = p2[i], r3 = p3[i];
      const a = (r1 * (p2[3] - p3[3]) - p1[3] * (r2 - r3) + (r2 * p3[3] - r3 * p2[3])) / det;
      const b = (p1[2] * (r2 - r3) - r1 * (p2[2] - p3[2]) + (p2[2] * r3 - p3[2] * r2)) / det;
      const cc = (p1[2] * (p2[3] * r3 - p3[3] * r2) - p1[3] * (p2[2] * r3 - p3[2] * r2) + r1 * (p2[2] * p3[3] - p3[2] * p2[3])) / det;
      return [a, b, cc];
    };
    const [a, b, c0] = solve(0), [d, e, f] = solve(1);
    return {
      fwd: (x, z) => [a * x + b * z + c0, d * x + e * z + f],
      vec: (x, z) => [a * x + b * z, d * x + e * z],
      inv: (u, v) => { const k = a * e - b * d; if (Math.abs(k) < 1e-12) return null; const uu = u - c0, vv = v - f; return [(e * uu - b * vv) / k, (a * vv - d * uu) / k]; }
    };
  }
  function setupMini(sdk) {
    const box = $('mini'), img = $('miniImg'), you = $('you'), cone = you.querySelector('.cone'), tabs = $('miniFloors');
    const floors = mini.floors.map((f, i) => f && f.file ? { i, label: f.label || String(i + 1), src: base + f.file, tf: affine(f.calib) } : null);
    const list = floors.filter(Boolean);
    const pos = mini.pos || 'br';
    box.style[pos[0] === 't' ? 'top' : 'bottom'] = pos[0] === 't' ? '14px' : '70px';
    box.style[pos[1] === 'l' ? 'left' : 'right'] = '14px';
    box.style.width = Math.min(mini.w || 240, innerWidth - 28) + 'px';
    let open = mini.open !== false && innerWidth > 640;
    try { const s = sessionStorage.getItem('g360mini'); if (s) open = s === '1'; } catch (e) {}
    box.classList.toggle('closed', !open);
    $('miniToggle').onclick = () => { open = !open; box.classList.toggle('closed', !open); try { sessionStorage.setItem('g360mini', open ? '1' : '0'); } catch (e) {} };
    let shown = list[0].i, pinned = false, lastFloor = null;
    function draw() {
      const f = floors[shown];
      if (img.dataset.src !== f.src) { img.src = f.src; img.dataset.src = f.src; }
      [...tabs.children].forEach(b => b.classList.toggle('on', +b.dataset.i === shown));
      const ps = pose;
      if (!ps || !f.tf || floorOf(ps) !== shown || !inside(ps)) { you.style.display = 'none'; return; }
      const [u, v] = f.tf.fwd(ps.position.x, ps.position.z);
      const yaw = (ps.rotation.y || 0) * Math.PI / 180, dx = -Math.sin(yaw), dz = -Math.cos(yaw);
      const [du, dv] = f.tf.vec(dx, dz), W = img.clientWidth || 1, H = img.clientHeight || 1;
      const ang = Math.atan2(dv * H, du * W);
      you.style.left = (u * 100) + '%'; you.style.top = (v * 100) + '%';
      cone.style.transform = 'rotate(' + ang + 'rad)';
      you.style.display = u >= -.05 && u <= 1.05 && v >= -.05 && v <= 1.05 ? 'block' : 'none';
    }
    if (list.length > 1) list.forEach(f => { const b = document.createElement('button'); b.textContent = f.label; b.dataset.i = f.i; b.onclick = () => { shown = f.i; pinned = true; draw(); }; tabs.appendChild(b); });
    img.addEventListener('load', draw);
    listeners.push(ps => { const fl = floorOf(ps); if (fl !== lastFloor) { lastFloor = fl; if (floors[fl]) { shown = fl; pinned = false; } } draw(); });
    if (sdk) img.addEventListener('click', e => {   // a click on the map moves to the nearest scan point on that floor
      const f = floors[shown]; if (!f || !f.tf) return;
      const r = img.getBoundingClientRect(), w = f.tf.inv((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
      if (!w) return;
      let best = null, bd = Infinity;
      const seen = new Set();
      Object.keys(sweeps).forEach(k => {
        const s = sweeps[k]; if (!s || seen.has(s) || s.enabled === false || !s.position) return; seen.add(s);
        const fl = s.floorInfo ? s.floorInfo.sequence : s.floor; if (fl !== shown) return;
        const d = (s.position.x - w[0]) ** 2 + (s.position.z - w[1]) ** 2; if (d < bd) { bd = d; best = s; }
      });
      if (best) sdk.Sweep.moveTo(best.sid || best.id, { transition: sdk.Sweep.Transition ? sdk.Sweep.Transition.FLY : undefined, transitionTime: 1200 }).catch(() => {});
    });
    box.hidden = false; draw();
  }

  // ===== calibration (owner only: …?calib=1) =====
  function setupCalib() {
    const box = $('calib');
    const fl = (mini ? mini.floors : []).map((f, i) => f && f.file ? { i, label: f.label || String(i + 1), src: base + f.file } : null).filter(Boolean);
    if (!fl.length) { box.innerHTML = '<h3>כיול מיני-מפה</h3><p>לא הועלו תמונות קומה לסיור הזה. הוסף אותן בסטודיו ופרסם שוב.</p>'; box.hidden = false; return; }
    const pts = {}; fl.forEach(f => { pts[f.i] = []; });
    let cur = fl[0].i;
    box.innerHTML = '<h3>כיול מיני-מפה</h3><p>1. בסיור, עמוד בנקודת סריקה (בתוך הבית, לא במבט-על).<br>2. לחץ במפה על אותה נקודה בדיוק.<br>3. חזור על כך ב-3 נקודות רחוקות זו מזו בכל קומה.<br>4. העתק את הקוד והדבק אותו בסטודיו.</p>'
      + '<div class="tabs" id="cTabs"></div><div id="cPos">—</div><div id="cWrap"><img id="cImg" alt=""></div>'
      + '<div class="tabs"><button id="cUndo">ביטול נקודה אחרונה</button><button id="cClear">איפוס הקומה</button></div>'
      + '<p id="cSt"></p><textarea id="cCode" readonly></textarea><div class="tabs"><button id="cCopy">העתקת הקוד</button></div>';
    const tabs = $('cTabs'), img = $('cImg'), wrap = $('cWrap');
    fl.forEach(f => { const b = document.createElement('button'); b.textContent = f.label; b.dataset.i = f.i; b.onclick = () => { cur = f.i; draw(); }; tabs.appendChild(b); });
    function draw() {
      const f = fl.find(x => x.i === cur);
      if (img.dataset.src !== f.src) { img.src = f.src; img.dataset.src = f.src; }
      [...tabs.children].forEach(b => b.classList.toggle('on', +b.dataset.i === cur));
      wrap.querySelectorAll('.cpt').forEach(n => n.remove());
      pts[cur].forEach((p, k) => { const d = document.createElement('div'); d.className = 'cpt'; d.textContent = k + 1; d.style.left = (p[0] * 100) + '%'; d.style.top = (p[1] * 100) + '%'; wrap.appendChild(d); });
      const out = {}; Object.keys(pts).forEach(k => { if (pts[k].length >= 3) out[k] = pts[k].map(p => p.map(n => Math.round(n * 10000) / 10000)); });
      $('cCode').value = Object.keys(out).length ? 'G360CAL:' + JSON.stringify(out) : '';
      $('cSt').textContent = 'בקומה הזו: ' + pts[cur].length + ' נקודות' + (pts[cur].length >= 3 ? ' ✓' : ' (צריך 3)');
    }
    img.addEventListener('click', e => {
      if (!pose || !inside(pose)) { $('cSt').textContent = 'קודם היכנס לתוך הסיור ועמוד בנקודת סריקה.'; return; }
      const r = img.getBoundingClientRect();
      pts[cur].push([(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, pose.position.x, pose.position.z]);
      if (pts[cur].length > 3) pts[cur].shift();
      draw();
    });
    $('cUndo').onclick = () => { pts[cur].pop(); draw(); };
    $('cClear').onclick = () => { pts[cur] = []; draw(); };
    $('cCopy').onclick = () => { const t = $('cCode'); t.select(); try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand('copy'); } $('cCopy').textContent = 'הועתק ✓'; setTimeout(() => { $('cCopy').textContent = 'העתקת הקוד'; }, 1500); };
    listeners.push(ps => { $('cPos').textContent = inside(ps) ? 'x ' + ps.position.x.toFixed(2) + '   z ' + ps.position.z.toFixed(2) + '   floor ' + floorOf(ps) : 'not inside'; });
    box.hidden = false; draw();
  }
})();
