<style>
  :root { --bg:#14181b; --panel:#1d2327; --ink:#e8ecee; --mute:#8e9aa1; --accent:#5ec4b6; --on-accent:#0b1412; --line:#2c353b; --line2:#3a464d; --kbd:#2a3338; --btn:rgba(29,35,39,.9); --glass:rgba(20,24,27,.58); --glass-strong:rgba(20,24,27,.9); --veil:rgba(20,24,27,.45); --glass-line:rgba(255,255,255,.09); --sep:rgba(255,255,255,.14); --hov:rgba(255,255,255,.1); --hov-line:rgba(255,255,255,.18); }
  :root[data-theme="light"] { --bg:#eef1f3; --panel:#ffffff; --ink:#1b2428; --mute:#5d6a72; --line:#cfd8dd; --line2:#b9c4ca; --kbd:#e6ebee; --btn:rgba(255,255,255,.92); --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.94); --veil:rgba(255,255,255,.55); --glass-line:rgba(0,0,0,.1); --sep:rgba(0,0,0,.14); --hov:rgba(0,0,0,.06); --hov-line:rgba(0,0,0,.18); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"Heebo","Segoe UI",system-ui,sans-serif; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  .panel { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--bg); z-index:5; }
  .panel > div { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:32px; max-width:480px; width:100%; }
  h1 { margin:0 0 8px; font-size:1.5rem; font-weight:700; }
  p { margin:0 0 20px; color:var(--mute); line-height:1.6; }
  input[type=file] { width:100%; color:var(--mute); }
  input[type=file]::file-selector-button { background:var(--accent); color:var(--on-accent); border:0; border-radius:6px; padding:10px 16px; margin-inline-end:12px; font:inherit; font-weight:600; cursor:pointer; }
  #msg { margin-top:16px; min-height:1.4em; color:var(--accent); line-height:1.5; }
  #msg.err { color:#ff8f80; }
  #click { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:3; color:var(--ink); font-size:1.1rem; background:var(--veil); cursor:pointer; }
  #dot { position:fixed; top:50%; left:50%; width:6px; height:6px; margin:-3px; border-radius:50%; background:var(--accent); z-index:4; pointer-events:none; }
  #floors { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:4; }
  #floors button { background:var(--btn); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; }
  #floors button.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
  #brand { position:fixed; top:12px; left:12px; z-index:7; display:flex; flex-direction:column; gap:5px; width:200px; max-width:calc(100vw - 24px); }   /* fixed, so the logo keeps the same width in every language */
  #logo { display:block; padding:6px 10px; background:#fff; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.35); }
  #logo img { display:block; width:100%; height:auto; }
  #logo.custom { cursor:default; }
  #logo.custom img { width:auto; max-width:100%; max-height:64px; margin:0 auto; }
  #pkgLogoSt { font-size:.85rem; opacity:.85; margin-inline:6px; }
  #projOpenStart { margin-top:8px; }
  #promoBox { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.82); display:flex; align-items:center; justify-content:center; padding:16px; }
  #promoBox[hidden] { display:none; }
  #promoBox .pbWrap { max-width:min(96vw,1280px); width:100%; display:flex; flex-direction:column; gap:10px; }
  #promoBox video { width:100%; max-height:78vh; background:#000; border-radius:10px; }
  #promoBox .pbBar { display:flex; gap:8px; justify-content:center; }
  #promoBox .pbBtn { display:inline-flex; align-items:center; padding:9px 18px; border-radius:10px; background:var(--glass-strong); color:var(--ink); border:1px solid var(--accent); font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
  #promoBox .pbBtn:hover { background:var(--accent); color:#0b1214; }
  #pkgPromoSt { font-size:.85rem; opacity:.85; margin-inline:6px; }
  .mlabel { position:fixed; top:0; left:0; z-index:4; pointer-events:none; display:inline-flex; align-items:center; gap:7px; background:var(--glass-strong); color:var(--ink); border:1px solid var(--accent); border-radius:999px; padding:4px 12px; font-size:.92rem; font-weight:600; white-space:nowrap; box-shadow:0 4px 14px rgba(0,0,0,.35); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  #fx { position:fixed; inset:0; z-index:3; pointer-events:none; opacity:0; background:radial-gradient(circle at center, transparent 40%, rgba(0,0,0,.5) 100%); }
  #fx.go { animation:fxgo .5s ease-out; }
  @keyframes fxgo { 0% { opacity:0; } 30% { opacity:1; } 100% { opacity:0; } }
  #hint { position:fixed; top:92px; left:50%; transform:translateX(-50%); z-index:6; max-width:min(560px, calc(100vw - 32px)); padding:12px 18px; border-radius:14px; background:var(--glass-strong); color:var(--ink); border:1px solid var(--accent); box-shadow:0 8px 30px rgba(0,0,0,.4); font-size:.95rem; line-height:1.55; text-align:center; cursor:pointer; animation:hintin .5s ease both; }
  @keyframes hintin { from { opacity:0; transform:translate(-50%,-10px); } to { opacity:1; transform:translate(-50%,0); } }
  #status { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:4; background:var(--glass-strong); color:var(--ink); border:1px solid color-mix(in srgb, var(--accent) 55%, transparent); padding:6px 14px; border-radius:999px; font-weight:500; font-size:.82rem; box-shadow:0 4px 16px rgba(0,0,0,.3); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); pointer-events:none; }
  #status:empty { display:none; }
  #tools { position:fixed; bottom:16px; right:16px; display:flex; gap:6px; z-index:4; }
  #tools button { background:var(--btn); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; white-space:nowrap; }
  #tools button.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
  #tools button:disabled { opacity:.4; cursor:default; }
  #modes { position:fixed; bottom:16px; left:16px; display:flex; gap:6px; z-index:4; }
  #modes button { background:var(--btn); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; }
  #modes button.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
  #dock { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:4; display:flex; align-items:stretch; justify-content:center; flex-wrap:wrap; gap:4px; padding:6px; max-width:calc(100vw - 24px); border-radius:16px; }
  #dock:has(> div:not([hidden])) { background:var(--glass); -webkit-backdrop-filter:blur(14px) saturate(1.2); backdrop-filter:blur(14px) saturate(1.2); border:1px solid var(--glass-line); box-shadow:0 8px 30px rgba(0,0,0,.4); }
  #dock > div { position:static; transform:none; left:auto; right:auto; bottom:auto; display:flex; align-items:center; gap:4px; flex:0 0 auto; flex-wrap:nowrap; justify-content:center; }   /* a group never shrinks, so buttons cannot overlap; whole groups wrap instead */
  #dock { flex-direction:column; flex-wrap:nowrap; align-items:center; width:max-content; }
  #dock > div:not([hidden]) ~ div { margin-inline-start:0 !important; }
  #dockTop { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:10px; }
  #dockTop:not(:has(> #modes:not([hidden]), > #floors:not([hidden]), > #miniGrp:has(> button:not([hidden])))) { display:none; }
  #dockTop > div { position:static; transform:none; left:auto; right:auto; bottom:auto; display:flex; align-items:center; flex:0 0 auto; }
  #dock #floors { position:relative !important; }
  #dock #floorBtn { gap:8px; }
  #dock #floorBtn .chev { width:14px; height:14px; opacity:.7; }
  #floorMenu { position:absolute; bottom:calc(100% + 12px); inset-inline-start:0; min-width:100%; display:flex; flex-direction:column; gap:2px; padding:5px; background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 34px rgba(0,0,0,.5); z-index:12; max-height:60vh; overflow:auto; }
  #floorMenu[hidden] { display:none; }
  #floorMenu .fRow { display:flex; align-items:center; gap:2px; border-radius:10px; }
  #floorMenu .fRow.on { background:var(--accent); }
  #floorMenu .fRow.on button { color:var(--on-accent); }
  #dock #floorMenu button { background:transparent; border:1px solid transparent; border-radius:10px; min-width:0; padding:8px 12px; }
  #dock #floorMenu .fItem { flex:1; justify-content:flex-start; text-align:start; }
  #dock #floorMenu .fEdit { padding:6px 8px; opacity:.55; }
  #dock #floorMenu .fRow:hover .fEdit, #dock #floorMenu .fEdit:hover { opacity:1; }
  #floorMenu .fRow.editing { padding:2px; }
  #floorMenu input { flex:1; min-width:140px; font:inherit; color:var(--ink); background:var(--btn); border:1px solid var(--accent); border-radius:8px; padding:7px 10px; }
  #dock #miniGrp { padding:3px; border-radius:15px; background:var(--hov); }
  #dock #miniGrp button { border-radius:12px; padding:9px 14px; color:var(--ink); font:inherit; font-size:.9rem; cursor:pointer; }
  #dock #miniGrp button.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
  #miniGrp:has(> button[hidden]) { display:none !important; }
  #dock > div:not([hidden]) ~ div:not([hidden]) { margin-inline-start:10px; }
  @media (max-width:1150px) { #tools .ib span { display:none; } }
  #dock button { white-space:nowrap; flex:0 0 auto; background:transparent; border:1px solid transparent; border-radius:10px; padding:8px 13px; }
  #dock button:hover:not(.on) { background:var(--hov); border-color:var(--hov-line); }
  /* dock polish: a little more room, softer glass, a pressed feel, and a clear lit state for the active mode / tool */

    help: `
    <h3>כניסה לסיור</h3>
    <ul>
      <li>בוחרים את תיקיית הסיור (קובץ OBJ, קובץ MTL וקבצי הטקסטורה) או קובץ E57 של ענן נקודות. המודל נפתח במבט-על.</li>
      <li>לוחצים על נקודה ברצפה כדי להיכנס אליה. העכבר תמיד חופשי: גוררים כדי להסתכל סביב, ולוחצים על העיגול ברצפה כדי ללכת אליו, כמו ב-Matterport.</li>
    </ul>
    <h3>ניווט</h3>
    <ul>
      <li><b>גרירה עם העכבר</b> מסובבת את המבט (התמונה זזה אחרי הסמן). אפשר גם <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> לתנועה, <kbd>Shift</kbd> מהר יותר, <kbd>E</kbd> / <kbd>Q</kbd> למעלה ולמטה (במצב טיסה).</li>
      <li><kbd>G</kbd> מחליף בין טיסה חופשית להליכה (עם התנגשות בקירות וצמידות לרצפה).</li>
      <li>קליק על העיגול ברצפה: קפיצה אליו. על קירות ותקרה מופיע אותו עיגול בלבן שקוף, וקליק עליו מקרב אותך לקיר.</li>
      <li><kbd>גלגלת</kbd> זום. במבט-על מתקרבים לנקודה שמתחת לסמן, ובתוך הסיור משנים את שדה הראייה.</li>
      <li><kbd>Esc</kbd> סוגר חלון פתוח או יוצא ממצב מדידה.</li>
    </ul>
    <h3>מצבי תצוגה וקומות</h3>
    <ul>
      <li>הלחצנים <b>מבט על</b> ו<b>תלת-ממד</b> בתחתית המסך (או <kbd>O</kbd>) מחליפים בין המבט מלמעלה לטיול בתוך המבנה.</li>
      <li>סרגל הקומות בתחתית, או <kbd>1</kbd>-<kbd>9</kbd> לקומה ו-<kbd>0</kbd> לכל הקומות. בחירת קומה מסתירה את מה שמעליה.</li>
      <li><kbd>B</kbd> מחליף בין תצוגה בשני צדדים לצד אחד, <kbd>R</kbd> מסובב את המודל ב-90° אם הוא נטען על הצד (בקבצי OBJ).</li>
      <li><b>מיני-מפה</b> בפינה (במצב תלת-ממד) מראה את תוכנית הקומה שבה אתם נמצאים, את מיקומכם ואת כיוון המבט. לחיצה על נקודה במפה מעבירה אתכם אליה.</li>
      <li>הלחצן <b>צילום</b> שומר תמונה של התצוגה עם הלוגו של Gambit360 ושם הפרויקט.</li>
      <li>הלחצן <b>נקודות</b> פותח רשימת נקודות מבט: לחיצה על נקודה מעבירה אליה. ב-Studio אפשר להוסיף את המיקום הנוכחי, לתת שם ולמחוק. בקובץ E57 הרשימה מתמלאת אוטומטית במיקומי הסריקה. הנקודות נשמרות בחבילה ללקוח, והלקוח יכול להוסיף נקודות משלו (הן נשמרות רק בדפדפן שלו, והנקודות שלכם נעולות אצלו). הלקוח יכול ללחוץ "ייצוא" ולשלוח לכם את הקובץ, ואתם מוסיפים אותו ב-Studio עם "ייבוא".</li>
    </ul>
    <h3>מדידת מרחק</h3>
    <ul>
      <li><kbd>M</kbd> או הכפתור <b>מדידה</b>. לוחצים על שתי נקודות על המודל, והמרחק מופיע על הקו.</li>
      <li>נקודה לבנה מראה בדיוק איפה הלחיצה תנחת.</li>
    </ul>
    <h3>מדידת שטח</h3>
    <ul>
      <li><kbd>P</kbd> או הכפתור <b>שטח</b>. לוחצים על פינות השטח לפי הסדר.</li>
      <li>לסיום: <kbd>Enter</kbd>, או לחיצה על הנקודה הראשונה (היא נצבעת בצהוב כשהסמן קרוב אליה). השטח מוצג במ"ר.</li>
      <li><kbd>Backspace</kbd> מבטל את הפינה האחרונה בזמן ציור.</li>
    </ul>
    <h3>דיוק ועריכה</h3>
    <ul>
      <li>אפשר לגרור כל נקודה של מדידה או שטח שהסתיימו, והמספר מתעדכן בזמן אמת.</li>
      <li><kbd>Backspace</kbd> מוחק את המדידה האחרונה, <kbd>X</kbd> מנקה את כולן.</li>
      <li>במצב מדידה או שטח אפשר לגרור עם העכבר כדי לסובב את המבט, וללכת עם <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>.</li>
      <li><kbd>Esc</kbd> יוצא ממצב מדידה או שטח.</li>
    </ul>
    <h3>ענן נקודות (E57)</h3>
    <ul>
      <li>הקובץ נטען כענן נקודות, מדולל לפי האיכות שבחרת (2, 4 או 8 מיליון נקודות). הצבעים נלקחים מהסריקה אם הם קיימים בקובץ.</li>
      <li><kbd>[</kbd> ו-<kbd>]</kbd> מקטינים ומגדילים את גודל הנקודות.</li>
      <li>במבט-על בוחרים קומה בסרגל כדי לראות חתך פנימי של הקומה. בלי בחירת קומה רואים את המבנה מלמעלה, כולל תקרות.</li>
      <li>הקומות מזוהות לפי מיקומי הסריקה, ולכן הן מופיעות רק אם הקובץ כולל מיקום לכל סריקה.</li>
      <li>כשהקובץ כולל תמונות של Matterport, בתוך המבנה מוצגות תמונות הסריקה במקום הענן. הניווט זהה: לוחצים על הרצפה כדי להתקדם לסריקה הקרובה (או W A S D), וגוררים כדי להסתכל. מבט-על ותלת-ממד מציגים את הענן. את המעבר בין פנורמה לענן עושים בתפריט <b>אפשרויות</b>. בחבילה ללקוח בוחרים את איכות הפנורמות: ככל שהאיכות גבוהה יותר החבילה גדולה יותר.</li>
      <li>הקירות הם נקודות ולא משטחים, לכן ההליכה (G) והבחירה של נקודה ברצפה מדויקות פחות מאשר ב-OBJ. במקום ריק בענן (חור בסריקה) לחיצה לא תמצא נקודה.</li>
    </ul>
    <h3>קישור ל-Matterport וזכירת הקובץ</h3>
    <ul>
      <li>הלחצן <b>סיור Matterport</b> (למעלה מימין) שומר קישור לסיור המקורי של המודל הנוכחי ופותח אותו בלשונית חדשה. הקישור נשמר במחשב לפי שם הקובץ.</li>
      <li>ב-Chrome וב-Edge התוכנה זוכרת את הקובץ או התיקייה האחרונים. בפתיחה הבאה היא טוענת אותם אוטומטית, או מציגה לחצן המשך ומבקשת אישור קריאה אחד. אם הקובץ הועבר או נמחק, צריך לבחור אותו שוב.</li>
      <li>הקובץ עצמו לא מועתק. נשמר רק מצביע אליו.</li>
      <li><b>חבילה ללקוח:</b> אחרי טעינת תיקיית OBJ ושמירת הקישור, לחצו "יצירת חבילה ללקוח" ובחרו תיקיית יעד (אפשר ליצור תיקייה חדשה ללקוח). הצפיין, lib ותיקיית <b>model</b> מועתקים אליה, וכל התיקייה מוכנה לשליחה. בפעם הראשונה תתבקשו לבחור את התיקייה שבה נמצא הצפיין. כשהלקוח פותח את הצפיין, הסיור נטען מיד, ואם אין תיקיית model נפתח חלון הטעינה הרגיל.</li>
    </ul>
    <h3>הגדרות</h3>
    <ul>
      <li>הלחצן <b>צבע</b> משנה את צבע הממשק, המדידות והעיגול ברצפה. הבחירה נשמרת במחשב. ברירת המחדל היא ציאן.</li>
      <li>הלחצן <b>English</b> מחליף את שפת הממשק, והבחירה נשמרת.</li>
      <li>הלחצן <b>שיפור תמונה</b> (בקבצי OBJ) מגביר מעט ניגודיות וצבע, כי טקסטורות של סריקות נוטות להיראות חיוורות. אפשר לכבות אותו.</li>
      <li><kbd>H</kbd> פותח וסוגר את העזרה.</li>
    </ul>
    <h3>חשוב לדעת</h3>
    <ul>
      <li>במדידות ב-OBJ אני מניח שהמודל בנוי במטרים. כדאי לבדוק על מידה מוכרת, כמו רוחב דלת. קובצי E57 הם תמיד במטרים.</li>
      <li>הדיוק תלוי באיכות ה-mesh או בצפיפות הנקודות. מדידה אל פינה חדה יכולה לסטות בכמה סנטימטרים.</li>
    </ul>`

        R: [1 - 2 * (qy * qy + qz * qz), 2 * (qx * qy - qw * qz), 2 * (qx * qz + qw * qy), 2 * (qx * qy + qw * qz), 1 - 2 * (qx * qx + qz * qz), 2 * (qy * qz - qw * qx), 2 * (qx * qz - qw * qy), 2 * (qy * qz + qw * qx), 1 - 2 * (qx * qx + qy * qy)] });

// Decodes the points of every scan (keeps every k-th point to stay within the budget). No DOM here: this also runs inside the Worker.
async function e57Points(file, scans, budget, onProgress, tr) {
  const p2l = e57P2L, u64 = e57U64, readLogical = (l0, len) => e57ReadLogical(file, l0, len);
  const yieldUI = () => new Promise(r => setTimeout(r, 0));
  const totalRecords = scans.reduce((a, s) => a + s.count, 0);
  const k = Math.max(1, Math.ceil(totalRecords / budget));      // keep every k-th point
  const cap = scans.reduce((a, s) => a + Math.ceil(s.count / k) + 2, 0);
  const P = new Float32Array(cap * 3), C = new Uint8Array(cap * 3);
  let cnt = 0, org = null, anyColor = false;
  const stations = [];
  const XYZ = ['cartesianX', 'cartesianY', 'cartesianZ'], SPH = ['sphericalRange', 'sphericalAzimuth', 'sphericalElevation'];
  const COLOR = ['colorRed', 'colorGreen', 'colorBlue'];
  const ROLE = { cartesianX: 'x', cartesianY: 'y', cartesianZ: 'z', sphericalRange: 'x', sphericalAzimuth: 'y', sphericalElevation: 'z',
                 cartesianInvalidState: 'inv', sphericalInvalidState: 'inv', colorRed: 'cr', colorGreen: 'cg', colorBlue: 'cb', intensity: 'it' };

  function readBits(arr, bitPos, bits) {
    let v = 0, got = 0, bp = bitPos >> 3, sh = bitPos & 7;
    while (got < bits) {
      const take = Math.min(8 - sh, bits - got);
      v += ((arr[bp] >> sh) & ((1 << take) - 1)) * Math.pow(2, got);
      got += take; bp++; sh = 0;
    }
    return v;
  }

  let lastYield = 0, doneRecords = 0;

  for (let si = 0; si < scans.length; si++) {
    const S = scans[si];
    const names = S.fields.map(f => f.name);
    const cart = XYZ.every(n => names.includes(n)), sph = SPH.every(n => names.includes(n));
    if (!cart && !sph) throw new Error(tr('e57NoCoords'));
    const want = new Set([...(cart ? XYZ : SPH), cart ? 'cartesianInvalidState' : 'sphericalInvalidState', ...COLOR, 'intensity']);
    const scanCap = Math.ceil(S.count / k) + 2;
    const st = S.fields.map(f => {
      if (!want.has(f.name) || f.kind === 'other') return null;
      const o = Object.assign({}, f, { role: ROLE[f.name], n: 0, idx: 0, carry: new Uint8Array(0), bitOff: 0 });
      if (f.kind === 'int' && f.bits === 0) o.constant = true;
      else o.out = (o.role === 'x' || o.role === 'y' || o.role === 'z') ? new Float64Array(scanCap) : new Float32Array(scanCap);
      return o;
    });
    const active = st.filter(f => f && !f.constant);
    const finished = () => active.every(f => f.idx >= S.count);

    function feed(f, bytes) {
      let buf = bytes;
      if (f.carry.length) { buf = new Uint8Array(f.carry.length + bytes.length); buf.set(f.carry); buf.set(bytes, f.carry.length); }
      const totalBits = buf.length * 8, bits = f.bits;
      let bp = f.bitOff;
      const dv = f.kind === 'float' ? new DataView(buf.buffer, buf.byteOffset, buf.byteLength) : null;
      while (f.idx < S.count) {
        const avail = Math.floor((totalBits - bp) / bits);
        if (avail <= 0) break;
        const r = f.idx % k;
        if (r !== 0) { const sk = Math.min(k - r, avail); bp += sk * bits; f.idx += sk; continue; }
        let v;
        if (f.kind === 'float') v = bits === 32 ? dv.getFloat32(bp >> 3, true) : dv.getFloat64(bp >> 3, true);
        else v = (readBits(buf, bp, bits) + f.min) * f.scale + f.offset;
        f.out[f.n++] = v;
        bp += bits; f.idx++;
      }
      f.carry = buf.slice(bp >> 3); f.bitOff = bp & 7;
    }

    // Stream the binary section in big chunks instead of loading the whole file.
    let buf = new Uint8Array(0), bstart = 0;
    const bytesAt = async (p, n) => {
      if (p < bstart || p + n > bstart + buf.length) {
        buf = await readLogical(p, Math.max(n, 16 * 1024 * 1024)); bstart = p;
        if (buf.length < n) throw new Error(tr('e57Truncated'));
      }
      return buf.subarray(p - bstart, p - bstart + n);
    };
    const sh = await bytesAt(p2l(S.offset), 32);
    const sdv = new DataView(sh.buffer, sh.byteOffset, 32);
    const secLen = u64(sdv, 8), dataPhys = u64(sdv, 16), indexPhys = u64(sdv, 24);
    let pos = p2l(dataPhys);
    const endLog = Math.min(indexPhys > 0 ? p2l(indexPhys) : Infinity, p2l(S.offset) + secLen);

    while (pos < endLog && !finished()) {
      const h = await bytesAt(pos, 6);
      const type = h[0], len = (h[2] | (h[3] << 8)) + 1;
      if (type === 1) {
        const pk = await bytesAt(pos, len);
        const nStreams = pk[4] | (pk[5] << 8);
        let o = 6 + 2 * nStreams;
        for (let i = 0; i < nStreams; i++) {
          const L = pk[6 + 2 * i] | (pk[7 + 2 * i] << 8);
          if (st[i] && !st[i].constant && L > 0) feed(st[i], pk.subarray(o, o + L));
          o += L;
        }
      } else if (type !== 0 && type !== 2) throw new Error(tr('e57BadPacket'));
      pos += len;
      const now = performance.now();
      if (now - lastYield > 120) {
        lastYield = now;
        const frac = Math.min(1, (pos - p2l(S.offset)) / Math.max(1, secLen));
        if (onProgress) onProgress(si + 1, scans.length, Math.round(frac * 100));
        await yieldUI();
      }
    }

    // Combine this scan's streams into global, Y-up, origin-shifted points.
    const F = role => st.find(f => f && f.role === role);
    const fx = F('x'), fy = F('y'), fz = F('z'), inv = F('inv'), cr = F('cr'), cg = F('cg'), cb = F('cb'), it = F('it');
    const n = Math.min(fx.n, fy.n, fz.n);
    const val = (f, j) => f.constant ? (f.min * f.scale + f.offset) : f.out[j];
    const hasRGB = !!(cr && cg && cb) && [cr, cg, cb].every(f => f.constant || f.n >= n);
    let iLo = Infinity, iHi = -Infinity;
    if (!hasRGB && it && it.n >= n) for (let j = 0; j < n; j++) { const v = it.out[j]; if (v < iLo) iLo = v; if (v > iHi) iHi = v; }
    const useI = !hasRGB && it && it.n >= n && iHi > iLo;
    if (hasRGB || useI) anyColor = true;
    let { w, x: qx, y: qy, z: qz } = S.pose.q;
    const qn = Math.hypot(w, qx, qy, qz) || 1; w /= qn; qx /= qn; qy /= qn; qz /= qn;
    const R = [1 - 2 * (qy * qy + qz * qz), 2 * (qx * qy - w * qz), 2 * (qx * qz + w * qy),
               2 * (qx * qy + w * qz), 1 - 2 * (qx * qx + qz * qz), 2 * (qy * qz - w * qx),
               2 * (qx * qz - w * qy), 2 * (qy * qz + w * qx), 1 - 2 * (qx * qx + qy * qy)];
    const T = S.pose.t;
    const nrm = (f, v) => Math.max(0, Math.min(255, 255 * (v - f.min) / ((f.max - f.min) || 1)));

    for (let j = 0; j < n; j++) {
      if (inv && val(inv, j) !== 0) continue;
      let x = fx.out[j], y = fy.out[j], z = fz.out[j];
      if (!cart) {  // spherical: range, azimuth, elevation
        const r = x, az = y, el = z, ce = Math.cos(el);
        x = r * ce * Math.cos(az); y = r * ce * Math.sin(az); z = r * Math.sin(el);
      }
      if (!(isFinite(x) && isFinite(y) && isFinite(z))) continue;
      const gx = R[0] * x + R[1] * y + R[2] * z + T.x, gy = R[3] * x + R[4] * y + R[5] * z + T.y, gz = R[6] * x + R[7] * y + R[8] * z + T.z;
      if (!org) org = [Math.round(gx), Math.round(gy), Math.round(gz)];
      const o = cnt * 3;
      P[o] = gx - org[0]; P[o + 1] = gz - org[2]; P[o + 2] = -(gy - org[1]);   // E57 is Z-up, the viewer is Y-up
      if (hasRGB) { C[o] = nrm(cr, val(cr, j)); C[o + 1] = nrm(cg, val(cg, j)); C[o + 2] = nrm(cb, val(cb, j)); }
      else if (useI) { const g = Math.round(40 + 215 * (it.out[j] - iLo) / (iHi - iLo)); C[o] = C[o + 1] = C[o + 2] = g; }
      else { C[o] = C[o + 1] = C[o + 2] = 150; }
      cnt++;
    }
    if (S.pose.has && org) { S.stIdx = stations.length; stations.push([T.x - org[0], T.z - org[2], -(T.y - org[1])]); }
    doneRecords += S.count;
    await yieldUI();
  }

  if (!cnt) throw new Error(tr('e57NoPoints'));
  const pos = P.slice(0, cnt * 3), col = C.slice(0, cnt * 3);
  if (!anyColor) {   // no colour or intensity in the file: colour by height
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < cnt; i++) { const y = pos[i * 3 + 1]; if (y < lo) lo = y; if (y > hi) hi = y; }
    for (let i = 0; i < cnt; i++) {
      const u = (pos[i * 3 + 1] - lo) / ((hi - lo) || 1);
      col[i * 3] = 40 + 200 * u; col[i * 3 + 1] = 90 + 130 * (1 - Math.abs(2 * u - 1)); col[i * 3 + 2] = 230 - 190 * u;
    }
  }
  return { pos, col, n: cnt, stations, k, total: totalRecords, hasColor: anyColor, stIdx: scans.map(S => S.stIdx) };
}

// Runs e57Points in a Worker made from the functions above (works from file:// too); falls back to running it here.
async function e57PointsAnywhere(file, scans, budget, onProgress, tr) {
  const keys = ['e57NoCoords', 'e57Truncated', 'e57BadPacket', 'e57NoPoints'], words = {};
  keys.forEach(k => words[k] = tr(k));
  let w = null, url = '';
  try {
    const src = 'const E57_PH = ' + E57_PH + ', E57_PL = ' + E57_PL + ';\n' + [e57P2L, e57U64, e57ReadLogical, e57Points].map(f => f.toString()).join('\n') +
      '\nonmessage = async e => { const m = e.data, words = m.words; try { const r = await e57Points(m.file, m.scans, m.budget, (i, n, p) => postMessage({ prog:[i, n, p] }), k => words[k] || k);' +
      ' postMessage({ done:r }, [r.pos.buffer, r.col.buffer]); } catch (err) { postMessage({ err:String(err && err.message || err) }); } };';
    url = URL.createObjectURL(new Blob([src], { type:'text/javascript' }));
    w = new Worker(url);
  } catch (err) { console.warn('E57: no background reader, reading on the page', err); if (url) URL.revokeObjectURL(url); return e57Points(file, scans, budget, onProgress, tr); }
  try {
    return await new Promise((res, rej) => {
      let any = false;
      w.onmessage = e => { const m = e.data; any = true;
        if (m.prog) { if (onProgress) onProgress(m.prog[0], m.prog[1], m.prog[2]); }
        else if (m.done) res(m.done); else rej(Object.assign(new Error(m.err), { fromWorker:true })); };
      w.onerror = e => { e.preventDefault(); rej(Object.assign(new Error(e.message || 'worker'), { startFail:!any })); };
      w.postMessage({ file, scans, budget, words });
    });
  } catch (err) {
    if (err.fromWorker) throw err;   // a real problem in the file: same message as before
    console.warn('E57: background reader failed, reading on the page', err);
    return e57Points(file, scans, budget, onProgress, tr);
  } finally { w.terminate(); URL.revokeObjectURL(url); }
}

function buildPickGrid(P, n) {
  let minX = Infinity, minY = Infinity, minZ = Infinity, maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
  for (let i = 0; i < n; i++) {
    const x = P[3 * i], y = P[3 * i + 1], z = P[3 * i + 2];
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
    if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
  }
  const diag = Math.hypot(maxX - minX, maxY - minY, maxZ - minZ);
  const vs = diag > 220 ? 0.1 : 0.05;
  const g = { vs, minX, minY, minZ, diag, midX: (minX + maxX) / 2, midY: (minY + maxY) / 2, midZ: (minZ + maxZ) / 2,
              NX: Math.floor((maxX - minX) / vs) + 3, NY: Math.floor((maxY - minY) / vs) + 3, NZ: Math.floor((maxZ - minZ) / vs) + 3,
              map: new Map(), nv: 0, sx: new Float64Array(1 << 18), sy: new Float64Array(1 << 18), sz: new Float64Array(1 << 18), cn: new Uint16Array(1 << 18) };
  const grow = () => {
    const c = g.sx.length * 2;
    for (const k of ['sx', 'sy', 'sz']) { const a = new Float64Array(c); a.set(g[k]); g[k] = a; }
    const cn = new Uint16Array(c); cn.set(g.cn); g.cn = cn;
  };
  for (let i = 0; i < n; i++) {
    const x = P[3 * i] - minX, y = P[3 * i + 1] - minY, z = P[3 * i + 2] - minZ;
    const key = (Math.floor(x / vs) + 1) + g.NX * ((Math.floor(y / vs) + 1) + g.NY * (Math.floor(z / vs) + 1));
    let id = g.map.get(key);
    if (id === undefined) { id = g.nv++; if (id >= g.sx.length) grow(); g.map.set(key, id); }
    g.sx[id] += x; g.sy[id] += y; g.sz[id] += z;
    if (g.cn[id] < 65535) g.cn[id]++;
  }
  return g;
}

function gridOcc(g, ix, iy, iz) {   // voxel id, or -1 when empty / outside
  if (ix < 0 || iy < 0 || iz < 0 || ix >= g.NX || iy >= g.NY || iz >= g.NZ) return -1;
  const id = g.map.get(ix + g.NX * (iy + g.NY * iz));
  return (id !== undefined && g.cn[id] >= 2) ? id : -1;
}

// First occupied voxel along a ray (points above clipY are ignored). Returns the voxel's centroid.
function gridCast(g, ox, oy, oz, dx, dy, dz, far, clipY) {
  const vs = g.vs, step = vs * 0.5;
  const lim = Math.min(far, Math.hypot(ox - g.midX, oy - g.midY, oz - g.midZ) + g.diag);
  for (let t = vs; t < lim; t += step) {
    const y = oy + dy * t;
    if (y > clipY) continue;
    const id = gridOcc(g, Math.floor((ox + dx * t - g.minX) / vs) + 1, Math.floor((y - g.minY) / vs) + 1, Math.floor((oz + dz * t - g.minZ) / vs) + 1);
    if (id >= 0) {
      const c = g.cn[id];
      return { x: g.sx[id] / c + g.minX, y: g.sy[id] / c + g.minY, z: g.sz[id] / c + g.minZ, t,
               ix: Math.floor((ox + dx * t - g.minX) / vs) + 1, iy: Math.floor((y - g.minY) / vs) + 1, iz: Math.floor((oz + dz * t - g.minZ) / vs) + 1 };
    }
  }
  return null;
}

// Is the surface around this voxel a horizontal one (floor-like)?
function gridFlat(g, ix, iy, iz) {
  let H = 0;
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    if (!dx && !dz) continue;
    if (gridOcc(g, ix + dx, iy, iz + dz) >= 0 || gridOcc(g, ix + dx, iy + 1, iz + dz) >= 0 || gridOcc(g, ix + dx, iy - 1, iz + dz) >= 0) H++;
  }
  return H >= 6 && !(gridOcc(g, ix, iy + 1, iz) >= 0 && gridOcc(g, ix, iy - 1, iz) >= 0);

    ray.set(camera.position.clone().setY(camera.position.y - 0.3 * scale), dir);
    ray.far = 0.45 * scale;
    return cast().length > 0;
  }

  function loop() {
    requestAnimationFrame(loop);
    if (tourOpen) { clock.getDelta(); return; }   // the 3D view rests while the Matterport tour is open
    syncMeasBtns();
    const dt = Math.min(clock.getDelta(), 0.1);
    if (look.on) {
      if (!panoOn || tween) look.on = false;
      else { const kk = 1 - Math.exp(-dt * 18); yaw += (look.y - yaw) * kk; pitch += (look.p - pitch) * kk; if (Math.abs(look.y - yaw) < 5e-4 && Math.abs(look.p - pitch) < 5e-4) look.on = false; }
    }
    camera.rotation.set(pitch, yaw, 0);

    if (tween) lowRes();   // a lighter picture while the camera glides, so the move never stutters
    if (tween) {
      tween.t = window.G360_REDUCE ? 1 : Math.min(1, tween.t + dt / (tween.dur || 0.4));
      const ez = tween.t * tween.t * (3 - 2 * tween.t);
      camera.position.lerpVectors(tween.from, tween.to, ez);
      if (tween.rot) { yaw = tween.rot.y0 + (tween.rot.y1 - tween.rot.y0) * ez; pitch = tween.rot.p0 + (tween.rot.p1 - tween.rot.p0) * ez; }
      if (tween.punch) { camera.fov = tween.punch.f0 + 7 * Math.sin(Math.PI * ez); camera.updateProjectionMatrix(); }
      if (tween.t >= 1) {
        if (tween.punch) { camera.fov = tween.punch.f0; camera.updateProjectionMatrix(); }
        if (tween.rot && tween.rot.yEnd !== undefined) yaw = tween.rot.yEnd;
        const fin = tween.onEnd; tween = null; if (fin) fin();

    }

    let speed = (keys.ShiftLeft || keys.ShiftRight ? 4.5 : 1.8) * scale * dt;
    if (overview) speed *= Math.max(3, span / 10);
    const fwd = new THREE.Vector3(), side = new THREE.Vector3();
    camera.getWorldDirection(fwd);
    if (walkable && !overview) fwd.y = 0;
    fwd.normalize();
    side.crossVectors(fwd, camera.up).normalize();

    const move = new THREE.Vector3();
    if (keys.KeyW) move.add(fwd);
    if (keys.KeyS) move.sub(fwd);
    if (keys.KeyD) move.add(side);
    if (keys.KeyA) move.sub(side);
    if (!walkable || overview) {
      if (keys.KeyE) move.y += 1;
      if (keys.KeyQ) move.y -= 1;
    }
    const hasMove = !panoOn && move.lengthSq() > 0;
    if (hasMove) move.normalize();

    const wk = walkable && !overview && !panoOn;
    if (wk) {
      // Collision rays are expensive on big meshes, so check a few times per second only.
      acc += dt;
      if (acc > 0.08) {
        acc = 0;
        blockCache = hasMove ? blocked(move.clone()) : false;
        ray.set(camera.position.clone().setY(camera.position.y + 0.5 * scale), new THREE.Vector3(0, -1, 0));
        ray.far = 4 * scale;
        const hit = cast()[0];
        floorY = hit && (hit.point.y + EYE - camera.position.y) < 0.6 * scale ? hit.point.y + EYE : null;
      }
    }
    if (dollhouse) {
      if (hasMove && !tween) { orb.target.x += move.x * speed; orb.target.z += move.z * speed; }
      if (!tween) {
        const k = window.G360_REDUCE ? 1 : 1 - Math.exp(-dt * 16);   // ease toward where the mouse asked to go, independent of frame rate
        orb.az += (orbGoal.az - orb.az) * k; orb.el += (orbGoal.el - orb.el) * k; orb.dist += (orbGoal.dist - orb.dist) * k;
        camera.position.copy(orbPos()); yaw = orb.az; pitch = -orb.el;
      } else { orbGoal.az = orb.az; orbGoal.el = orb.el; orbGoal.dist = orb.dist; }
    } else
    if (hasMove && !tween && !(wk && blockCache)) camera.position.addScaledVector(move, speed);
    if (wk && floorY !== null) camera.position.y += (floorY - camera.position.y) * Math.min(1, dt * 10);

    if (panoSrc) panoSync(dt);
    if (pcMat) pcMat.uniforms.uPx.value = renderer.domElement.height * 0.5;
    updateThickness();
    if (promo && typeof promoStep === 'function') promoStep();
    updateMarker(dt);
    updateLabels();
    updateMini(dt);
    renderer.render(scene, camera);
    if (promo && typeof promoFrame === 'function') promoFrame();
  }

  function updateModeLabel() { const el = $('mode'); if (el) el.textContent = t(walkable ? 'modeWalk' : 'modeFly'); }

  // Called whenever the language changes: refresh everything built from text.
  onLang = () => {
    if (window.PROJ_TITLE) setProjectTitle(window.PROJ_TITLE, window.PROJ_MANAGER);
    setExpiry(window.G360_EXPIRES);
    [...$('swatches').children].forEach(sw => { sw.title = t(sw.dataset.n); });
    updateModeLabel();
    buildFloorBar();
    if (renderer) [...measures, ...areas].forEach(buildShape);
    if (measuring) say(t('measureHint')); else if (areaMode) say(t('areaHint'));
    setResumeLabel(); if (typeof refreshSrc === 'function') refreshSrc(); alignTopPanels(); fillTourMsg(); refreshPanoOpts(); updatePanoSw(); refreshPromoSt();
  };
  if (window.G360_CLIENT) { const pb = $('promoBtn'); pb.setAttribute('data-i18n-title', 'promoPlayTip'); pb.querySelector('span').setAttribute('data-i18n', 'promoPlay'); }
  applyLang(LANG);
  (async () => {
    try { if (await tryPackage()) return; await tryResume(); }
    finally { hideBoot(); }
  })();
}

    if (!j.ok) { say(j.error === 'action' ? L('stOld') : j.error === 'key' ? L('pingKey') : L('stFail', j.error)); return; }
    const st = j.stats || {}, today = j.today || new Date().toISOString().slice(0, 10);
    const rows = Object.keys(st).map(slug => ({ slug, t: stTourOf(slug), s: st[slug] }));
    tours.forEach(o => { const sl = o.upSlug; if (sl && !st[sl]) rows.push({ slug: sl, t: o, s: null }); });   // uploaded tours with no visits yet
    rows.sort((a, c) => ((c.s && c.s.d30) || 0) - ((a.s && a.s.d30) || 0) || ((c.s && c.s.n) || 0) - ((a.s && a.s.n) || 0));
    const nm = r => r.t ? (r.t.name || r.t.client || r.slug) : r.slug;
    if (!rows.some(r => r.s)) { say(L('stNone')); b.insertAdjacentHTML('beforeend', '<div class="note">' + esc(L('stNote')) + '</div>'); return; }
    if (!rows.some(r => r.slug === stCur)) stCur = (rows.find(r => r.s) || rows[0]).slug;
    b.innerHTML = '<div class="stWrap"><table class="stT"><thead><tr><th>' + esc(L('stTour')) + '</th><th class="n">' + esc(L('st7')) + '</th><th class="n">' + esc(L('st30')) + '</th><th class="n">' + esc(L('stAll')) + '</th><th class="n">' + esc(L('stNew')) + '</th><th>' + esc(L('stLast')) + '</th></tr></thead><tbody></tbody></table></div><div data-d></div><div class="row"><button type="button" data-r></button></div><div class="note"></div>';
    const tb = b.querySelector('tbody'), det = b.querySelector('[data-d]');
    rows.forEach(r => {
      const s = r.s || {}, tr = document.createElement('tr'); tr.dataset.slug = r.slug;
      tr.innerHTML = '<td class="nm" dir="auto"></td><td class="n">' + (s.d7 || 0) + '</td><td class="n">' + (s.d30 || 0) + '</td><td class="n">' + (s.n || 0) + '</td><td class="n">' + (s.u || 0) + '</td><td>' + esc(stDate(s.last)) + '</td>';
      tr.firstChild.textContent = nm(r) + (r.t ? '' : ' (' + L('stUnknown') + ')');
      tr.onclick = () => { stCur = r.slug; show(); };
      tb.appendChild(tr);
    });
    b.querySelector('[data-r]').textContent = L('stRefresh'); b.querySelector('[data-r]').onclick = () => openStats();
    b.lastChild.textContent = L('stNote');
    function show() {
      tb.querySelectorAll('tr').forEach(x => x.classList.toggle('sel', x.dataset.slug === stCur));
      const r = rows.find(x => x.slug === stCur), s = r && r.s;
      if (!s) { det.innerHTML = '<div class="stMsg"></div>'; det.firstChild.textContent = L('stNone'); return; }
      const days = []; { const d0 = new Date(today + 'T12:00:00Z'); for (let i = 29; i >= 0; i--) { const d = new Date(d0 - i * 864e5).toISOString().slice(0, 10); days.push([d, (s.day || {})[d] || 0]); } }
      const mx = Math.max(1, ...days.map(x => x[1])), dv = s.dev || {}, dn = (dv.d || 0) + (dv.m || 0) + (dv.t || 0) || 1;
      const pct = n => Math.round(100 * (n || 0) / dn) + '%';
      const devTxt = [['d', 'stDevD'], ['m', 'stDevM'], ['t', 'stDevT']].filter(([k]) => dv[k]).map(([k, l]) => L(l) + ' ' + pct(dv[k])).join(', ');
      const mons = Object.keys(s.mon || {}).sort().reverse().slice(0, 12);
      const refs = Object.keys(s.ref || {});
      det.innerHTML = '<h4 dir="auto"></h4><div class="stKv"><div><b>' + (s.n || 0) + '</b><span>' + esc(L('stAll') + ' · ' + L('stSince', stDate(s.first).slice(0, 10))) + '</span></div><div><b>' + (s.d30 || 0) + '</b><span>' + esc(L('st30')) + '</span></div><div><b>' + (s.d7 || 0) + '</b><span>' + esc(L('st7')) + '</span></div><div><b>' + (s.u || 0) + '</b><span>' + esc(L('stNew')) + '</span></div></div>'
        + '<h4>' + esc(L('stDays')) + '</h4><div class="stBars">' + days.map(([d, n]) => '<i' + (n ? '' : ' class="z"') + ' style="height:' + Math.max(2, Math.round(n / mx * 100)) + '%" title="' + esc(stDate(d) + ': ' + n) + '"></i>').join('') + '</div><div class="stAx"><span>' + esc(stDate(days[0][0])) + '</span><span>' + esc(stDate(today)) + '</span></div>'
        + '<h4>' + esc(L('stMonths')) + '</h4><ul class="stList">' + mons.map(m => '<li><span>' + esc(he() ? m.slice(5) + '/' + m.slice(0, 4) : m) + '</span><b>' + s.mon[m] + '</b></li>').join('') + '</ul>'
        + '<h4>' + esc(L('stDev')) + '</h4><ul class="stList">' + [['d', 'stDevD'], ['m', 'stDevM'], ['t', 'stDevT']].map(([k, l]) => '<li><span>' + esc(L(l)) + '</span><b>' + (dv[k] || 0) + ' · ' + pct(dv[k]) + '</b></li>').join('') + '</ul>'
        + '<h4>' + esc(L('stRef')) + '</h4><ul class="stList">' + refs.map(k => '<li><span dir="ltr">' + esc(k === '-' ? L('stDirect') : k) + '</span><b>' + s.ref[k] + '</b></li>').join('') + '</ul>'
        + '<div class="row"><button type="button" class="pri" data-c></button></div>';
      det.querySelector('h4').textContent = nm(r);
      const cb = det.querySelector('[data-c]'); cb.textContent = L('stCopy');
      cb.onclick = () => {
        const link = settings.base.replace(/\/?$/, '/') + r.slug;
        const txt = [L('rpH', (r.t && (r.t.title || r.t.name)) || r.slug), link, L('rpAt', stDate(today)), '', '• ' + L('rpAll', s.n || 0, stDate(s.first).slice(0, 10)), '• ' + L('rp30', s.d30 || 0), '• ' + L('rp7', s.d7 || 0), '• ' + L('rpNew', s.u || 0)]
          .concat(devTxt ? ['• ' + L('rpDev', devTxt)] : [], mons.length ? ['• ' + L('rpMon', mons.slice(0, 6).map(m => (he() ? m.slice(5) + '/' + m.slice(0, 4) : m) + ': ' + s.mon[m]).join(', '))] : []).join('\n');
        copyText(txt, L('stCopied'));
      };
    }
    show();
  }
  // ---- open / close ----

    if (!tours.length) msg(L('rsHint'));
    if (cur) cur = tours.find(t => t.id === cur.id) || null;
    if (!cur && tours.length) cur = tours[0];
    modLook(true); $('live').hidden = false; renderList(); renderEdit(); preview(true); bkDismiss = false; checkBk();
    if (settings.upKey) bkSrvAuto();   // what changed on another computer comes in
  }

  const accVars = hex => { const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16), st = document.documentElement.style; st.setProperty('--accent', hex); st.setProperty('--on-accent', (.299 * r + .587 * g + .114 * b) / 255 > .55 ? '#0b1412' : '#ffffff'); };
  const studioLang = () => { let l = 'he'; try { l = localStorage.getItem('tourViewerLang') || 'he'; } catch (e) {} return l === 'en' ? 'en' : 'he'; };
  const studioAcc = () => { let a = ''; try { a = localStorage.getItem('tourViewerAccent') || ''; } catch (e) {} return /^#[0-9a-f]{6}$/i.test(a) ? a.toLowerCase() : '#5ec4b6'; };
  function modLook(on) {
    const lg = on && /^(he|en)$/.test(settings.mLang || '') ? settings.mLang : studioLang(), ac = on && /^#[0-9a-f]{6}$/i.test(settings.mAcc || '') ? settings.mAcc : studioAcc();
    accVars(ac); $('lvAcc').firstChild.value = ac; $('lvAcc').style.setProperty('--sw', ac);
    if (typeof LANG !== 'undefined' && LANG !== lg) applyLang(lg, false);   // re-labels the module too (G360_relang below)
    $('lvLang').textContent = lg === 'he' ? 'EN' : '\u05e2\u05d1'; $('lvLang').title = L('mLang'); $('lvAcc').title = L('mAcc');
  }
  $('lvLang').onclick = () => { settings.mLang = (document.documentElement.lang || 'he') === 'en' ? 'he' : 'en'; saveSet(); modLook(true); };
  $('lvAcc').firstChild.oninput = e => { settings.mAcc = e.target.value.toLowerCase(); saveSet(); modLook(true); };
  $('lvAcc').oncontextmenu = e => { e.preventDefault(); settings.mAcc = ''; saveSet(); modLook(true); };
  function close() { if (settings.upKey) bkSrvAuto(); stopPrev(); modLook(false); $('live').hidden = true; $('lvSet').hidden = true; $('lvDlg').hidden = true; const fr = $('lvFrame'); fr.src = 'about:blank'; lastSrc = ''; }
  $('lvClose').onclick = close;
  $('lvSetBtn').onclick = openSet;
  $('lvStats').onclick = () => openStats(cur);
  const colTog = k => { settings.ui = settings.ui || {}; settings.ui[k] = !settings.ui[k]; saveSet(); colUI(); };
  $('lvColEdit').onclick = () => colTog('noEdit'); $('lvColList').onclick = () => colTog('noList');
  $('lvTopIco').onchange = () => { settings.topIco = $('lvTopIco').checked; saveSet(); topBtns(); };

  addEventListener('keydown', e => {

  const startBox = $('projOpenStart');
  if (startBox) { const b = document.createElement('button'); b.type = 'button'; b.id = 'liveStartBtn'; b.className = 'resume'; b.onclick = open; startBox.insertAdjacentElement('afterend', b); }
